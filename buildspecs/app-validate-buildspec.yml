version: 0.2

env:
  variables:
    AWS_REGION: us-east-1

phases:
  install:
    commands:
      - echo "Installing validation dependencies..."
      - pip install --upgrade pip
      - pip install -r requirements.txt

  build:
    commands:
      - echo "Running Python syntax validation..."
      - python -m compileall -q site_test scripts
      - echo "Running import smoke checks..."
      - |
        python - <<'PY'
        import site_test
        from site_test import url_test, usr_input
        print("Import smoke checks passed")
        PY

  post_build:
    commands:
      - echo "Application validation completed"

artifacts:
  files:
    - '**/*'
  name: AppValidateArtifact

cache:
  paths:
    - '/root/.cache/pip/**/*'
