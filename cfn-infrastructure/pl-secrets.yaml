AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Pipeline-specific secrets for WebsiteTester. RDS password is auto-generated for CI/CD,
  using fixed pipeline-only secret names.

Resources:
  PipelineRdsCredentialsSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: rds/db-credentials
      Description: Pipeline-managed credentials secret for PostgreSQL RDS database used by WebsiteTester.
      GenerateSecretString:
        SecretStringTemplate: '{"username":"dbadmin"}'
        GenerateStringKey: password
        PasswordLength: 24
        ExcludePunctuation: true

  PipelineWebtesterSshPublicKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: websitetester/ssh/webtester-public-key
      Description: Pipeline-managed SSH public key for ECS container user webtester
      SecretString: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHkjnHf95oxK9cOL7AlHOg+i/HaqWQlFenX4hJvv4fG2 webtester-ecs

Outputs:
  RdsCredentialsSecretName:
    Description: Name of the pipeline-managed PostgreSQL RDS credentials secret
    Value: !Ref PipelineRdsCredentialsSecret

  RdsCredentialsSecretArn:
    Description: ARN of the pipeline-managed PostgreSQL RDS credentials secret
    Value: !GetAtt PipelineRdsCredentialsSecret.Id

  SshPublicKeySecretName:
    Description: Name of the pipeline-managed SSH public key secret
    Value: !Ref PipelineWebtesterSshPublicKeySecret

  SshPublicKeySecretArn:
    Description: ARN of the pipeline-managed SSH public key secret
    Value: !GetAtt PipelineWebtesterSshPublicKeySecret.Id
