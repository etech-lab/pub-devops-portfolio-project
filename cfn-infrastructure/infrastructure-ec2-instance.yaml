AWSTemplateFormatVersion: '2010-09-09'
Description: >
  EC2 Instance for Infrastructure Management.
  Deploy with stack name 'devops-infra-instance' (for RDS access and management tasks)

Parameters:
  VpcStackName:
    Type: String
    Default: devops-vpc-stack
    Description: Name of the VPC stack to import network resources

  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues:
      - t3.micro
      - t3.small
      - t3.medium
    Description: EC2 instance type

  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: Latest Amazon Linux 2023 AMI ID

  InstanceSubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Subnet ID for the infrastructure instance (choose public or private subnet)

Resources:
  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub ${AWS::StackName}-sg
      GroupDescription: Security group for infrastructure management instance
      VpcId:
        Fn::ImportValue: !Sub ${VpcStackName}-VpcId
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Allow all outbound traffic
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-sg

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AWS::StackName}-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
      Policies:
        - PolicyName: RDSAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - rds:DescribeDBInstances
                  - cloudformation:DescribeStacks
                  - cloudformation:ListExports
                  - ec2:DescribeSubnets
                  - ec2:DescribeRouteTables
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:CompleteLayerUpload
                  - ecr:DescribeImages
                  - ecr:DescribeRepositories
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:ListImages
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource: !Sub arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/websitetester
              - Effect: Allow
                Action:
                  - ecs:UpdateService
                  - ecs:DescribeServices
                Resource: !Sub arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:service/websitetester-cluster/websitetester-service
              - Effect: Allow
                Action:
                  - ecs:ExecuteCommand
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecs:DescribeClusters
                Resource: !Sub arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:cluster/websitetester-cluster
              - Effect: Allow
                Action:
                  - ecs:DescribeTaskDefinition
                Resource: !Sub arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/websitetester-task:*
              - Effect: Allow
                Action:
                  - ecs:DescribeTaskDefinition
                  - ecs:ListTaskDefinitions
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecs:RegisterTaskDefinition
                  - ecs:DeregisterTaskDefinition
                  - ecs:DescribeTasks
                  - ecs:ListTasks
                  - ecs:ListServices
                  - ecs:ListClusters
                Resource: '*'
              - Effect: Allow
                Action:
                  - iam:PassRole
                Resource:
                  - !Sub arn:aws:iam::${AWS::AccountId}:role/websitetester-service-task-role
                  - !Sub arn:aws:iam::${AWS::AccountId}:role/websitetester-service-execution-role
              - Effect: Allow
                Action:
                  - logs:DescribeLogStreams
                  - logs:GetLogEvents
                  - logs:FilterLogEvents
                Resource:
                  - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/ecs/websitetester
                  - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/ecs/websitetester:*
                  - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/ecs/websitetester:*:log-stream:*
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-role

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub ${AWS::StackName}-profile
      Roles:
        - !Ref InstanceRole

  Instance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref LatestAmiId
      IamInstanceProfile: !Ref InstanceProfile
      SubnetId: !Ref InstanceSubnetId
      SecurityGroupIds:
        - !Ref InstanceSecurityGroup
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -euo pipefail

          dnf -y update
          dnf -y install \
            docker \
            git \
            jq \
            wget \
            unzip \
            tar \
            gzip \
            python3 \
            python3-pip \
            python3-virtualenv \
            ca-certificates

          systemctl enable docker
          systemctl start docker
          usermod -aG docker ec2-user

          mkdir -p /opt/websitetester
          chown ec2-user:ec2-user /opt/websitetester

          cat >/etc/profile.d/devops-tools.sh <<'EOF'
          export AWS_DEFAULT_REGION=us-east-1
          EOF
          chmod 0644 /etc/profile.d/devops-tools.sh

          if ! command -v aws >/dev/null 2>&1; then
            dnf -y install awscli
          fi

          python3 -m pip install --upgrade pip
      Tags:
        - Key: Name
          Value: devops-infra-instance

Outputs:
  InstanceId:
    Description: EC2 Instance ID
    Value: !Ref Instance
    Export:
      Name: !Sub ${AWS::StackName}-InstanceId

  InstancePrivateIp:
    Description: Private IP address
    Value: !GetAtt Instance.PrivateIp
    Export:
      Name: !Sub ${AWS::StackName}-PrivateIp

  SecurityGroupId:
    Description: Security group ID
    Value: !Ref InstanceSecurityGroup
    Export:
      Name: !Sub ${AWS::StackName}-SecurityGroupId

  SelectedSubnetId:
    Description: Subnet ID used by the infrastructure instance
    Value: !Ref InstanceSubnetId

  SubnetTypeCheckCommand:
    Description: Run this command to check if the selected subnet is public (has IGW route) or private
    Value: !Sub >-
      aws ec2 describe-route-tables --filters Name=association.subnet-id,Values=${InstanceSubnetId}
      --query "RouteTables[].Routes[?GatewayId!=null].[DestinationCidrBlock,GatewayId]" --output table

  SSMConnectionCommand:
    Description: Command to connect via SSM
    Value: !Sub 'aws ssm start-session --target ${Instance}'
