AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Bootstrap IAM users and roles for RDS PostgreSQL access.
  Deploy with stack name 'btstrp-db-postgres-iam-stack'.

Parameters:
  CreateRdsDeploymentUser:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Create IAM user for RDS deployment (creates access keys - save immediately)

Resources:
  RdsDeploymentUser:
    Type: AWS::IAM::User
    Condition: ShouldCreateUser
    Properties:
      UserName: rds-deploy-user
      ManagedPolicyArns:
        - !Ref RdsDeploymentPolicy
      Tags:
        - Key: UseCase
          Value: RDS Deployment

  RdsDeploymentUserAccessKey:
    Type: AWS::IAM::AccessKey
    Condition: ShouldCreateUser
    Properties:
      UserName: !Ref RdsDeploymentUser

  RdsDeploymentPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: rds-deployment-policy
      Description: Permissions for deploying VPC, RDS, and related infrastructure
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: CloudFormationAccess
            Effect: Allow
            Action:
              - cloudformation:CreateStack
              - cloudformation:CreateChangeSet
              - cloudformation:DeleteChangeSet
              - cloudformation:UpdateStack
              - cloudformation:DeleteStack
              - cloudformation:DescribeChangeSet
              - cloudformation:DescribeStacks
              - cloudformation:DescribeStackEvents
              - cloudformation:DescribeStackResource
              - cloudformation:DescribeStackResources
              - cloudformation:ExecuteChangeSet
              - cloudformation:GetTemplate
              - cloudformation:GetTemplateSummary
              - cloudformation:ListChangeSets
              - cloudformation:ListExports
              - cloudformation:ListStackResources
              - cloudformation:ListStacks
              - cloudformation:ValidateTemplate
            Resource: '*'
          - Sid: EC2VPCAccess
            Effect: Allow
            Action:
              - ec2:CreateVpc
              - ec2:DeleteVpc
              - ec2:ModifyVpcAttribute
              - ec2:DescribeVpcs
              - ec2:CreateSubnet
              - ec2:DeleteSubnet
              - ec2:ModifySubnetAttribute
              - ec2:DescribeSubnets
              - ec2:CreateSecurityGroup
              - ec2:DeleteSecurityGroup
              - ec2:DescribeSecurityGroups
              - ec2:AuthorizeSecurityGroupIngress
              - ec2:AuthorizeSecurityGroupEgress
              - ec2:RevokeSecurityGroupIngress
              - ec2:RevokeSecurityGroupEgress
              - ec2:CreateInternetGateway
              - ec2:DeleteInternetGateway
              - ec2:AttachInternetGateway
              - ec2:DetachInternetGateway
              - ec2:DescribeInternetGateways
              - ec2:CreateNatGateway
              - ec2:DeleteNatGateway
              - ec2:DescribeNatGateways
              - ec2:AllocateAddress
              - ec2:ReleaseAddress
              - ec2:DescribeAddresses
              - ec2:CreateRouteTable
              - ec2:DeleteRouteTable
              - ec2:DescribeRouteTables
              - ec2:CreateRoute
              - ec2:DeleteRoute
              - ec2:AssociateRouteTable
              - ec2:DisassociateRouteTable
              - ec2:CreateTags
              - ec2:DeleteTags
              - ec2:DescribeAvailabilityZones
            Resource: '*'
          - Sid: EC2InstanceProvisioningAccess
            Effect: Allow
            Action:
              - ec2:RunInstances
              - ec2:TerminateInstances
              - ec2:DescribeInstances
              - ec2:DescribeInstanceStatus
              - ec2:DescribeImages
              - ec2:DescribeInstanceTypes
              - ec2:DescribeNetworkInterfaces
              - ec2:DescribeVolumes
            Resource: '*'
          - Sid: RDSAccess
            Effect: Allow
            Action:
              - rds:CreateDBInstance
              - rds:DeleteDBInstance
              - rds:DescribeDBInstances
              - rds:ModifyDBInstance
              - rds:CreateDBSubnetGroup
              - rds:DeleteDBSubnetGroup
              - rds:DescribeDBSubnetGroups
              - rds:AddTagsToResource
              - rds:ListTagsForResource
              - rds:CreateDBSnapshot
              - rds:DeleteDBSnapshot
              - rds:DescribeDBSnapshots
            Resource: '*'
          - Sid: SecretsManagerAccess
            Effect: Allow
            Action:
              - secretsmanager:CreateSecret
              - secretsmanager:DeleteSecret
              - secretsmanager:DescribeSecret
              - secretsmanager:GetSecretValue
              - secretsmanager:PutSecretValue
              - secretsmanager:TagResource
              - secretsmanager:UntagResource
              - secretsmanager:UpdateSecret
            Resource: '*'
          - Sid: ELBv2Access
            Effect: Allow
            Action:
              - elasticloadbalancing:AddTags
              - elasticloadbalancing:CreateListener
              - elasticloadbalancing:CreateLoadBalancer
              - elasticloadbalancing:CreateTargetGroup
              - elasticloadbalancing:DeleteListener
              - elasticloadbalancing:DeleteLoadBalancer
              - elasticloadbalancing:DeleteTargetGroup
              - elasticloadbalancing:DescribeListeners
              - elasticloadbalancing:DescribeLoadBalancers
              - elasticloadbalancing:DescribeTags
              - elasticloadbalancing:DescribeTargetGroups
              - elasticloadbalancing:ModifyLoadBalancerAttributes
              - elasticloadbalancing:ModifyTargetGroup
              - elasticloadbalancing:RemoveTags
            Resource: '*'
          - Sid: IAMProvisioningAccess
            Effect: Allow
            Action:
              - iam:AddRoleToInstanceProfile
              - iam:AttachRolePolicy
              - iam:CreateInstanceProfile
              - iam:CreateRole
              - iam:DeleteInstanceProfile
              - iam:DeleteRole
              - iam:DeleteRolePolicy
              - iam:DetachRolePolicy
              - iam:GetInstanceProfile
              - iam:GetRole
              - iam:GetRolePolicy
              - iam:ListInstanceProfilesForRole
              - iam:PassRole
              - iam:PutRolePolicy
              - iam:RemoveRoleFromInstanceProfile
              - iam:TagInstanceProfile
              - iam:TagRole
            Resource: '*'
          - Sid: SSMParameterRead
            Effect: Allow
            Action:
              - ssm:GetParameter
              - ssm:GetParameters
            Resource: '*'
          - Sid: SSMSessionAccess
            Effect: Allow
            Action:
              - ssm:StartSession
              - ssm:TerminateSession
              - ssm:ResumeSession
              - ssm:DescribeSessions
              - ssm:GetConnectionStatus
            Resource: '*'

  LambdaRDSAccessRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: lambda-rds-access-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        - !Ref ApplicationRDSPolicy
      Tags:
        - Key: UseCase
          Value: Lambda RDS Access

  ApplicationRDSPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: application-rds-access-policy
      Description: Permissions for applications to access RDS via Secrets Manager
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: SecretsManagerRead
            Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
              - secretsmanager:DescribeSecret
            Resource: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:rds/*'
          - Sid: RDSDescribe
            Effect: Allow
            Action:
              - rds:DescribeDBInstances
            Resource: '*'

Conditions:
  ShouldCreateUser: !Equals [!Ref CreateRdsDeploymentUser, 'true']

Outputs:
  DeploymentPolicyArn:
    Description: ARN of deployment policy (attach to manually created IAM user)
    Value: !Ref RdsDeploymentPolicy
    Export:
      Name: !Sub ${AWS::StackName}-DeploymentPolicyArn

  DeploymentUserName:
    Condition: ShouldCreateUser
    Description: IAM User for deployment
    Value: !Ref RdsDeploymentUser

  DeploymentAccessKeyId:
    Condition: ShouldCreateUser
    Description: Access Key ID (save immediately - shown only once)
    Value: !Ref RdsDeploymentUserAccessKey

  DeploymentSecretAccessKey:
    Condition: ShouldCreateUser
    Description: Secret Access Key (save immediately - shown only once)
    Value: !GetAtt RdsDeploymentUserAccessKey.SecretAccessKey

  LambdaRoleArn:
    Description: IAM Role ARN for Lambda functions
    Value: !GetAtt LambdaRDSAccessRole.Arn
    Export:
      Name: !Sub ${AWS::StackName}-LambdaRoleArn

  ApplicationPolicyArn:
    Description: ARN of application RDS access policy
    Value: !Ref ApplicationRDSPolicy
    Export:
      Name: !Sub ${AWS::StackName}-ApplicationPolicyArn
