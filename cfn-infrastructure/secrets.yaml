AWSTemplateFormatVersion: '2010-09-09'
Description: Stores WebsiteTester secrets, including PostgreSQL RDS credentials and SSH public key.

Parameters:
  RdsCredentialsSecretName:
    Type: String
    Default: rds/db-credentials
    Description: Name for the PostgreSQL RDS credentials secret.

  DBUsername:
    Type: String
    Default: dbadmin
    Description: Username for the PostgreSQL RDS database credentials secret.

  DBPassword:
    Type: String
    NoEcho: true
    MinLength: 8
    Description: Password for the PostgreSQL RDS database credentials secret.

Resources:
  RdsCredentialsSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Ref RdsCredentialsSecretName
      Description: Credentials secret for PostgreSQL RDS database used by WebsiteTester.
      SecretString: !Sub '{"username":"${DBUsername}","password":"${DBPassword}"}'

  WebtesterSshPublicKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: websitetester/ssh/webtester-public-key
      Description: SSH public key for ECS container user webtester
      SecretString: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHkjnHf95oxK9cOL7AlHOg+i/HaqWQlFenX4hJvv4fG2 webtester-ecs

Outputs:
  RdsCredentialsSecretName:
    Description: Name of the PostgreSQL RDS credentials secret
    Value: !Ref RdsCredentialsSecret

  RdsCredentialsSecretArn:
    Description: ARN of the PostgreSQL RDS credentials secret
    Value: !GetAtt RdsCredentialsSecret.Id

  SshPublicKeySecretName:
    Description: Name of the SSH public key secret
    Value: !Ref WebtesterSshPublicKeySecret

  SshPublicKeySecretArn:
    Description: ARN of the SSH public key secret
    Value: !GetAtt WebtesterSshPublicKeySecret.Id
